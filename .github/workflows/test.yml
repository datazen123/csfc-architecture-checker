name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: bandit (reported, non-blocking on low-severity findings)
        run: |
          bandit -r . -x "./.venv,./test_csfc_checker.py,./test_csfc_checker_properties.py" \
            --severity-level medium
